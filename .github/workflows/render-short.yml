name: Render Short

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Path to job JSON under jobs/ (e.g. jobs/foo.json)"
        required: true
        type: string
  push:
    paths:
      - "jobs/**.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve job path
        id: job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          else
            JOB=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'jobs/*.json' | head -n1 || true)
            if [ -z "$JOB" ]; then
              JOB=$(ls -1 jobs/*.json 2>/dev/null | tail -n1 || true)
            fi
          fi
          if [ -z "$JOB" ] || [ ! -f "$JOB" ]; then
            echo "No job JSON found"
            exit 1
          fi
          echo "path=$JOB" >> "$GITHUB_OUTPUT"
          echo "Using job: $JOB"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m factory render --job "${{ steps.job.outputs.path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-output
          path: output/**/output.mp4
          if-no-files-found: error
          retention-days: 7
