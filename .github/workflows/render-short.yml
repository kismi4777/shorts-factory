name: Render Short

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Path to job JSON under jobs/ (e.g. jobs/foo.json)"
        required: true
        type: string
  push:
    paths:
      - "jobs/**.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve job path
        id: job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          else
            JOB=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'jobs/*.json' | head -n1 || true)
            if [ -z "$JOB" ]; then
              JOB=$(ls -1 jobs/*.json 2>/dev/null | tail -n1 || true)
            fi
          fi
          if [ -z "$JOB" ] || [ ! -f "$JOB" ]; then
            echo "No job JSON found"
            exit 1
          fi
          echo "path=$JOB" >> "$GITHUB_OUTPUT"
          echo "Using job: $JOB"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Large gameplay beds live in a Release (not in git). Needed for reddit_gameplay.
      - name: Fetch gameplay backgrounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/backgrounds
          if ls assets/backgrounds/gameplay_*.mp4 >/dev/null 2>&1; then
            echo "backgrounds already present"
            exit 0
          fi
          TAG="backgrounds-v1"
          echo "Downloading release $TAG …"
          gh release download "$TAG" -R "${{ github.repository }}" -p "gameplay_beds.zip" -O /tmp/gameplay_beds.zip
          unzip -o /tmp/gameplay_beds.zip -d assets/backgrounds
          ls assets/backgrounds/gameplay_*.mp4 | wc -l

      - name: Render
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -m factory render --job "${{ steps.job.outputs.path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-output
          path: output/**/output.mp4
          if-no-files-found: error
          retention-days: 7
